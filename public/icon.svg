<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    3am app mark.

    The ring-and-slash from the login screen, in the app's own monochrome
    palette. Everything sits inside the central 60% so the shape survives
    Android's maskable-icon crop.
  -->
  <rect width="512" height="512" fill="#0a0a0a"/>

  <!-- Faint grid, echoing the app background -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <path d="M128 0V512M256 0V512M384 0V512M0 128H512M0 256H512M0 384H512"/>
  </g>

  <!-- Ring -->
  <circle cx="256" cy="256" r="132" fill="none" stroke="#ffffff" stroke-width="26"/>

  <!-- Diagonal slash -->
  <line x1="162" y1="350" x2="350" y2="162" stroke="#ffffff" stroke-width="26" stroke-linecap="butt"/>
</svg>
